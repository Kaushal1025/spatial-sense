<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Spatial Sense</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Spatial Sense</h1>

    <label for="goal">What are you looking for? (optional)</label>
    <input id="goal" type="text" placeholder="e.g. find the door" autocomplete="off">

    <button id="toggle" type="button" aria-pressed="false">Start</button>

    <p id="status" role="status" aria-live="polite">Stopped.</p>

    <video id="camera" autoplay playsinline muted aria-hidden="true"></video>

    <section aria-labelledby="regions-heading">
      <h2 id="regions-heading">Detected</h2>
      <ul id="regions"><li>Nothing yet.</li></ul>
    </section>
  </main>

  <canvas id="frame" hidden></canvas>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
